services:
  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  flyway-migrate:
    image: flyway/flyway:latest
    command: >
      -url=jdbc:postgresql://postgres-db:5432/demo
      -user=demo
      -password=demo
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      - postgres-db

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-db:5432/demo
      QUARKUS_DATASOURCE_USERNAME: demo
      QUARKUS_DATASOURCE_PASSWORD: demo
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_FLYWAY_MIGRATE_AT_START: "false"
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
    depends_on:
      - flyway-migrate
    ports:
      - "8080:8080"

volumes:
  pgdata:
