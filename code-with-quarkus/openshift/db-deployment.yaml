apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRESQL_DATABASE: quarkus
  POSTGRESQL_USER: quarkus
  POSTGRESQL_PASSWORD: quarkus
  POSTGRESQL_ADMIN_PASSWORD: adminquarkus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel8/postgresql-13:latest
          env:
            - name: POSTGRESQL_DATABASE
              value: quarkus
            - name: POSTGRESQL_USER
              value: quarkus
            - name: POSTGRESQL_PASSWORD
              value: quarkus
          ports:
            - containerPort: 5432
