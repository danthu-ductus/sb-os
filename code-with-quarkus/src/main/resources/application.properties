# cfg db information
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo

quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-db:localhost:5432/demo
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/demo

# starta Flyway migrationer auto
quarkus.flyway.migrate-at-start=false

#hibernate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.schema-management.strategy=validate

# fixar så swagger är med i prod, kanske ej smart om man
# vill köra med Quarkus i dev mode lokalt
quarkus.swagger-ui.always-include=true
